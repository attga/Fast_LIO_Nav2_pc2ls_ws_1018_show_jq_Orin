alaserRelocalizer:
  ros__parameters:
    start_on_launch: true  # 独立启动默认值；正式入口 localization.launch.py 强制设为 false。
    pose_file: isam_poses.txt  # 优化后的 T_map_body 位姿文件；启动参数可覆盖文件名。
    sc_dist_thres: 0.50  # Scan Context 描述子距离门限，无量纲。
    sc_ds_size: 0.4  # 体素尺寸，单位 m。
    yaw_diff_sign: -1.0  # SC 航向初值的符号系数。
    submap_halfwidth: 10  # 前后关键帧索引半宽，不是米。
    submap_min_points: 1000  # 配准体素滤波前的最少子图点数。
    icp_ds_size: 0.4  # 配准体素尺寸，单位 m。
    icp_max_corr_dist: 3.0  # 配准对应距离上限，单位 m。
    icp_fitness_thres: 2.0  # 评分上限，单位 m²；最近邻评分不限制距离，与持续定位的统计范围不同。
    icp_t_max: 5.0  # 相对 SC 初值的位置修正上限，单位 m。
    icp_yaw_max_deg: 30.0  # 单位度。
    confirm_frames: 1  # 一致的有效结果数；拒绝的匹配不会清空已有计数。
    confirm_position_thresh: 2.0  # 单位 m。
    confirm_yaw_thresh_deg: 15.0  # 单位度。
    debug_publish_clouds: false
