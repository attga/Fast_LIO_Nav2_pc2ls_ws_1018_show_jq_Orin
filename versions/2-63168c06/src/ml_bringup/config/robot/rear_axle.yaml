# 新车临时近似：按用户决定，未知平移先设零；非实测标定，Livox 已知 +90° 保留。
base_reference: rear_axle
mounts:
  wheel:
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
  yesense:
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
  livox_imu:
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 1.5707963267948966]
  # T_imu_lidar，与 fast_lio/config/mid360.yaml 的固定内部外参一致。
  # 此值是既有配置，不代表此次重新标定；整个设备旋转不改变内部外参。
  livox_lidar:
    xyz: [-0.011, -0.02329, 0.04412]
    rpy: [0.0, 0.0, 0.0]
