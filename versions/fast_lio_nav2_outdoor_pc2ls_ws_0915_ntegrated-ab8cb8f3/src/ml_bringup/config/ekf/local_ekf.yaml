# 输出 /local_odometry/filter，话题名称由正式 launch 重映射设置。
# 正式双 EKF：Local EKF，唯一发布 odom -> base_link。
# 默认 launch 叠加 imu.yaml，融合 Yesense 三轴角速度，暂不融合其加速度。
# /lidar_odometry 仅融合绝对位姿；FAST-LIO 未提供有效 twist，不融合其零速度字段。
# 二维园区模式；禁止接入 ICP/global 位姿，避免全局修正进入局部里程计。
# 状态向量顺序：x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az。
ekf_filter_node_local:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.25
    two_d_mode: true
    print_diagnostics: true
    debug: false
    publish_tf: true
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /lidar_odometry
    odom0_config: [
      true, true, true,
      true, true, true,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    # /wheel_odom 的速度位于 child_frame_id=body，静态 TF 将其转换到 base_link。
    # 仅融合前向速度和航向角速度，不融合积分位姿及无效零值字段。
    odom1: /wheel_odom
    odom1_config: [
      false, false, false,
      false, false, false,
      true, false, false,
      false, false, true,
      false, false, false
    ]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 20
    use_control: false
    # 完整 15×15 矩阵按行展开，共 225 项，兼容 Humble/Jazzy；非对角项为零。
    process_noise_covariance: [
