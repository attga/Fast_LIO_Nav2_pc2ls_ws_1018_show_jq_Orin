# ==============================================================================
# Nav2 导航参数配置文件 (针对 0915 双 EKF 定位 + Nav2 架构优化版)
# 定位由 0915 双 EKF 提供：Global EKF 发布 map->odom，Local EKF 发布 odom->base_link
# 采用 pointcloud_to_laserscan 进行 3D 激光雷达点云降维为 /scan 避障
# ==============================================================================

# ------------------------------------------------------------------------------
# 静态地图服务器 (Map Server)
# 由 Nav2 map_server 发布由 3D 点云转换而来的 2D 静态栅格地图
# 定位功能 (map→odom→base_link TF) 由 0915 定位节点负责
# yaml_filename 为占位符，实际路径由 nav2_bringup.launch.py 在启动时动态注入
# ------------------------------------------------------------------------------xuiuuuuu
map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

# ------------------------------------------------------------------------------
# 行为树导航器 (BT Navigator) - 负责执行导航任务逻辑
# ------------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map           # 全局坐标系
    robot_base_frame: base_link # 机器人基座坐标系
    odom_topic: /odom    # 订阅 Local EKF 融合里程计
    bt_loop_duration: 10        # 指导树循环执行周期 (ms)
    default_server_timeout: 20  # 服务器响应默认超时时间 (s)
    default_nav_through_poses_bt_xml: "src/my_nav2_config/config/navigate_through_poses_custom.xml"

# ------------------------------------------------------------------------------
# 控制器服务器 (Controller Server) - 局部路径跟随和避障
# 采用 MPPI (Model Predictive Path Integral) 控制器
# MPPI 通过 Monte Carlo 随机采样，天然输出平滑轨迹，对 3D 雷达检测到的密集障碍更鲁棒
# ------------------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: False
    odom_topic: /odom  # 控制器独立订阅 Local EKF，不能继承 BT/平滑器的参数。
    controller_frequency: 10.0  # 控制指令发布频率 (Hz)（10Hz与0.1s model_dt精准对齐）
    transform_tolerance: 0.5           
    min_x_velocity_threshold: 0.001        # X方向最小速度阈值
    min_y_velocity_threshold: 0.5          # Y方向最小速度阈值 (差速车通常不看此项)
    min_theta_velocity_threshold: 0.001    # 角速度最小速度阈值
    failure_tolerance: 0.5                 # 控制器失败容忍度 (s)
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # 进度检查：确保机器人一直在动，没有卡死
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25       # 规定时间内必须移动的最小距离 (m)
      movement_time_allowance: 25.0        # 移动超时时间由15.0s放宽至25.0s，给终点对齐留出缓冲
    
    # 目标检查：判断是否到达目的地
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30              # 到达目标的距离容差由0.25m微调至0.30m
      yaw_goal_tolerance: 0.50             # 到达目标的角度容差由0.25rad(14.3°)放宽至0.50rad(28.6°)消除死锁
    
    # ------------------------------------------------------------------
    # MPPI 局部控制器参数
    # 插件：nav2_mppi_controller::MPPIController
    # ------------------------------------------------------------------
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # ── 基础运动学约束（与底盘匹配）──
      motion_model: "DiffDrive"            # 差速驱动运动学模型
      # 速度阶梯验证配置 (详见 DEBUG_REPORT 第六节 SOP)：
      # 【阶段一 0.6m/s 防摆验证】: vx_max: 0.6 (当前预设，先跑通防摆闭环)
      # 【阶段二 1.0m/s 提速巡航】: vx_max: 1.0 (通过阶段一后修改此项)
      # 【阶段三 1.5m/s 极速验收】: vx_max: 1.5 (现场配备手持急停后测试)
      vx_max:  1.0                         # 最大前进线速度；与 velocity_smoother 同步 (m/s)
      vx_min: -0.25                        # 最大后退线速度（允许小幅后退脱困）
      vy_max:  0.0                         # 侧向速度上限（差速车为0）
      wz_max:  1.0                         # 最大角速度 (rad/s)
      ax_max:  2.5                         # 最大线加速度 (m/s²) —— 保留平滑起步
      ax_min: -2.5                         # 最大线减速度 (m/s²)
      az_max:  3.5                         # 最大角加速度 (rad/s²) 由 3.5 限制至 1.5 rad/s²，物理消除蛇行摆头

      # ── Monte Carlo 采样参数 ──
      batch_size: 400                     # 方案 F1：由 800 优化为 400（满足差速车低速寻优，释放 50% CPU 开销）
      time_steps: 30                       # 轨迹前瞻步数（30 × 0.1s = 3.0s 预测时域）
      model_dt: 0.1                        # 仿真步长 (s)
      prune_distance: 7.0                  # 前方路径剪裁距离由 4.0m 扩大至 7.0m，满足 1.5m/s × 3.0s = 4.5m 巡航前瞻
      max_robot_pose_search_dist: 2.5      # 保留原 5m 地图对应的最近路径点搜索范围，避免随扩图增大。

      iteration_count: 1                   # MPPI 迭代次数（增加可提升质量但CPU开销翻倍）
      temperature: 0.5                     # 轨迹权重温度由 0.3 提升至 0.5，软化权重分布，大幅增加控制阻尼
      gamma: 0.015                         # 时间折扣因子

      # ── 控制噪声标准差（控制探索多样性）──
      vx_std: 0.2
      wz_std: 0.4                          # 角速度探索噪声标准差收敛至 0.2 rad/s，避免过激探索引发摆头
      vy_std: 0.0                          # 差速车固定为 0

      # ── Critics（代价评估器）──
      critics: [
        "ConstraintCritic",
        "CostCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "PreferForwardCritic",
        "CruiseSpeedCritic"
      ]

      # ── Critic 权重 ──
      ConstraintCritic.enabled: true
      ConstraintCritic.cost_power: 1
      ConstraintCritic.cost_weight: 4.0

      CostCritic.enabled: true
      CostCritic.cost_power: 1
      CostCritic.cost_weight: 3.5  # (原为 6.0，调高，让它更怕障碍物)
      CostCritic.critical_cost: 300.0
      CostCritic.consider_footprint: True  # 按机器人轮廓计算碰撞（更精确）
      CostCritic.collision_cost: 10000.0
      CostCritic.near_goal_distance: 0.5   # 终点抑制距离由1.0m缩减至0.5m，避免终点前过早过度制动卡死

      GoalCritic.enabled: true
      GoalCritic.cost_power: 1
      GoalCritic.cost_weight: 5.0
      GoalCritic.threshold_to_consider: 1.4

      GoalAngleCritic.enabled: true
      GoalAngleCritic.cost_power: 1
      GoalAngleCritic.cost_weight: 3.0
      GoalAngleCritic.threshold_to_consider: 0.5

      PathAlignCritic.enabled: true
      PathAlignCritic.cost_power: 1
      PathAlignCritic.cost_weight: 5.0     # 航向对齐权重设为 5.0，解除对横向回正的过度压制
      PathAlignCritic.max_path_occupancy_ratio: 0.05
      PathAlignCritic.trajectory_point_step: 3
      PathAlignCritic.threshold_to_consider: 0.5
      PathAlignCritic.offset_from_furthest: 10 # 前瞻评估保留 20 步 (2.0 秒)
      PathAlignCritic.use_path_orientations: false

      PathFollowCritic.enabled: true
      PathFollowCritic.cost_power: 1
      PathFollowCritic.cost_weight: 4.0    # 横向纠偏权重设为 4.0，温和引导车辆贴近中心线
      PathFollowCritic.offset_from_furthest: 10 # 由 25 (仅0.5s) 优化为 10 (前瞻 2.0s，1.2~2.0米长视距更平稳)
      PathFollowCritic.threshold_to_consider: 1.4

      PathAngleCritic.enabled: true
      PathAngleCritic.cost_power: 1
      PathAngleCritic.cost_weight: 2.0
      PathAngleCritic.offset_from_furthest: 4
      PathAngleCritic.threshold_to_consider: 0.5
      PathAngleCritic.max_angle_to_furthest: 1.2
      PathAngleCritic.forward_preference: true

      PreferForwardCritic.enabled: true
      PreferForwardCritic.cost_power: 1
      PreferForwardCritic.cost_weight: 5.0
      PreferForwardCritic.threshold_to_consider: 0.5

      # 空旷近直线路段偏好巡航速度；弯道、短路径、旧扫描或代价通道受阻时退出。
      # 这是有界轨迹代价，不修改 cmd_vel，不设置最低车速，原避障/停车评估仍生效。
      CruiseSpeedCritic.enabled: true
      # 速度阶梯验证：阶段一 0.6；阶段二改 1.0；阶段三改 1.5
      CruiseSpeedCritic.target_speed: 1.0
      CruiseSpeedCritic.cost_weight: 8.0
      CruiseSpeedCritic.clearance_margin: 0.15
      CruiseSpeedCritic.scan_timeout: 0.3
      CruiseSpeedCritic.scan_topic: /scan

      # ── 可视化 ──
      visualize: false                     # 方案 F1：关闭候选轨迹发布（节省大量 DDS 序列化与网络带宽）
      publish_optimal_trajectory: true     # 发布最优轨迹供RViz显示
      transform_tolerance: 0.5

# ------------------------------------------------------------------------------
# 局部代价地图 (Local Costmap) - 负责实时感知避障
# 改造：弃用 VoxelLayer，改用 ObstacleLayer 消费 /scan（2D激光），彻底消除Z轴漂移问题
# ------------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0               # 与 controller_frequency 10Hz 精准对齐
      publish_frequency: 1.0               # 方案 F1：由 2.0 调整为 1.0 Hz（降低可视化广播开销）
      global_frame: map                   # 当前使用 map；切换 odom 需单独验证，本轮保持原值。
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true                 # 局部地图随车移动
      width: 8                             # 4m 半宽覆盖 3.2m 预测行程及车体轮廓 (m)
      height: 8                            # 与 width 一致，支持任意行驶方向 (m)
      resolution: 0.05                     # 分辨率(m/pixel)
      footprint: "[ [0.58, 0.275], [-0.07, 0.275], [-0.07, -0.275], [0.58, -0.275] ]"
      transform_tolerance: 2.0                  
      plugins: ["obstacle_layer", "inflation_layer"]  # 弃用 voxel_layer
      filters: ["keepout_filter"]

      # 掩膜层过滤器：加载禁区掩膜 (KeepoutFilter)
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"

      # 2D障碍物层：消费 /scan（由 pointcloud_to_laserscan 转换），2D射线追踪稳定可靠
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: true
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0

      # 膨胀层：防止机器人贴墙走
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.5

      always_send_full_costmap: True

# ------------------------------------------------------------------------------
# 全局代价地图 (Global Costmap) - 负责长距离规划导航
# 改造：弃用 VoxelLayer，改用 ObstacleLayer 消费 /scan（2D激光），彻底消除Z轴漂移问题
# ------------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0                # 周期性更新频率 (全局地图1.0Hz)
      publish_frequency: 2.0               # 可视化发布频率
      global_frame: map                    # 全局地图以map为参考系
      robot_base_frame: base_link
      use_sim_time: False
      footprint: "[ [0.58, 0.275], [-0.07, 0.275], [-0.07, -0.275], [0.58, -0.275] ]"
      transform_tolerance: 2.0                  # 机器人等效半径 (m)# 机器人等效半径 (m)
      resolution: 0.05
      track_unknown_space: true            # 是否跟踪未知区域
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]  # 弃用 voxel_layer
      filters: ["keepout_filter"]

      # 掩膜层过滤器：加载禁区掩膜 (KeepoutFilter)
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"

      # 2D障碍物层：消费 /scan，observation_persistence=0 依赖实时扫描清除，彻底杜绝幽灵障碍积累
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        
        min_obstacle_height: -10.0
        max_obstacle_height: 35.0

        observation_sources: scan
        scan:
          topic: /scan
          min_obstacle_height: -10.0
          max_obstacle_height: 35.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: true
          raytrace_max_range: 9.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.5
          obstacle_min_range: 0.0
          observation_persistence: 0.0     # 持久化，依赖实时激光清除

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.5

      always_send_full_costmap: True

# ------------------------------------------------------------------------------
# 规划器服务器 (Planner Server) - 负责全局路径计算
# ------------------------------------------------------------------------------
planner_server:
  ros__parameters:
    expected_planner_frequency: 0.5
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5                       # 终点容差 (m)
      allow_unknown: true                  # 允许在未知区域规划
      # use_final_approach_orientation: false
      use_cost_power: 3
      minimum_turning_radius: 0.0
      cost_travel_multiplier: 2.0   # 新增：穿越高代价区域的惩罚因子，迫使规划器绕行
# ------------------------------------------------------------------------------
# 速度平滑器 (Velocity Smoother) - 限制速度突变以保护电机
# ------------------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0              # 平滑频率
    scale_velocities: False
    feedback: "CLOSED_LOOP"                  # 由 CLOSED_LOOP 改为 OPEN_LOOP，彻底切断编码器延迟引入的 200ms 纯滞后自激震荡
    # 速度阶梯验证：阶段一 [0.6, 0.0, 1.0]；阶段二改 [1.0, 0.0, 1.0]；阶段三改 [1.5, 0.0, 1.0]
    max_velocity: [1.5, 0.0, 1.0]          # 前进上限与 MPPI 同步；角速度保持原值
    min_velocity: [-1.5, 0.0, -1.0]        # 反向速度与正向对称
    max_accel: [2.5, 0.0, 3.5]             # 将角加速度硬上限从 3.5 降至 1.5 rad/s² (86°/s²)
    max_decel: [-2.5, 0.0, -3.5]           # 角减速度上限同步降至 -1.5 rad/s²
    deadband_velocity: [0.0, 0.0, 0.0]     # 死区速度
    odom_topic: "odom"   # [Local EKF] 订阅 0915 Local EKF 融合里程计 (/local_odometry/filter)
    odom_duration: 0.1

# ------------------------------------------------------------------------------
# 行为服务器 (Behavior Server) - 负责卡住时的自动脱困及恢复行为
# ------------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin","backup", "drive_on_heading", "wait"]
    # behavior_plugins: ["drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0               # 恢复动作前向模拟时间
    max_rotational_vel: 0.8                # 恢复旋转最大角速度
    min_rotational_vel: 0.2                # 恢复旋转最小角速度
    rotational_acc_lim: 1.6                # 恢复旋转加速度限制

# ==============================================================================
# Costmap Filters 掩膜层服务节点参数配置 (Keepout 禁区过滤)
# 对应 nav2_map_server 中的 costmap_filter_info_server 与 filter_mask_server
# ==============================================================================
costmap_filter_info_server:
  ros__parameters:
    use_sim_time: False
    type: 0 # 0: Keepout Zone (禁区), 1: Speed Zone (限速百分比), 2: Speed Zone (绝对限速 m/s)
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/filter_mask"
    base: 0.0
    multiplier: 1.0

filter_mask_server:
  ros__parameters:
    use_sim_time: False
    frame_id: "map"
    topic_name: "/filter_mask"
    yaml_filename: "map_jeck/keepout_mask.yaml" # 掩膜地图 yaml 路径，也可在 launch 中通过参数传入重写
