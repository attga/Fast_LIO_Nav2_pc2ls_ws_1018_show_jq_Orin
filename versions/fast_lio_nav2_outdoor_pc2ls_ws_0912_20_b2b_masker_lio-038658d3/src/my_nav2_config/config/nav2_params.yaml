# ==============================================================================
# Nav2 导航参数配置文件 (针对 LIO-SAM + Nav2 架构优化版)
# 采用 LIO-SAM_MID360_ROS2_PKG 提供里程计 (odom->base_link) 与全局定位 (map->odom)
# 取消 AMCL，采用 PointcloudToLaserscan 进行 2D 激光雷达点云避障
# ==============================================================================

amcl:
  ros__parameters:
    use_sim_time: False

# ------------------------------------------------------------------------------
# 静态地图服务器 (Map Server)
# 由 Nav2 map_server 发布由 3D 点云转换而来的 2D 静态栅格地图
# 定位功能 (map->odom->base_link TF) 由 LIO-SAM 定位节点 (lio_sam_relocalization) 负责
# yaml_filename 为占位符，实际路径由 launch 文件启动时动态注入
# ------------------------------------------------------------------------------
map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

# ------------------------------------------------------------------------------
# 行为树导航器 (BT Navigator) - 负责执行导航任务逻辑
# ------------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map           # 全局坐标系
    robot_base_frame: base_link # 机器人基座坐标系
    odom_topic: local_lidar_odom # LIO-SAM 高频局部里程计话题
    bt_loop_duration: 10        # 指导树循环执行周期 (ms)
    default_server_timeout: 20  # 服务器响应默认超时时间 (s)
    default_nav_through_poses_bt_xml: "src/my_nav2_config/config/navigate_through_poses_custom.xml"

# ------------------------------------------------------------------------------
# 控制器服务器 (Controller Server) - 局部路径跟随和避障
# 采用 MPPI (Model Predictive Path Integral) 控制器
# MPPI 通过 Monte Carlo 随机采样，天然输出平滑轨迹，对 3D 雷达检测到的密集障碍更鲁棒
# ------------------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 5.0   # 恢复为5.0Hz，确保Jetson CPU占用平稳，杜绝超频丢帧与降频风险
    transform_tolerance: 0.5           
    min_x_velocity_threshold: 0.001        # X方向最小速度阈值
    min_y_velocity_threshold: 0.5          # Y方向最小速度阈值 (差速车通常不看此项)
    min_theta_velocity_threshold: 0.001    # 角速度最小速度阈值
    failure_tolerance: 0.5                 # 控制器失败容忍度 (s)
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # 进度检查：确保机器人一直在动，没有卡死
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3        # [P1] 规定时间内必须移动的最小距离 (m) (0.5→0.3)
      movement_time_allowance: 5.0         # [P1] 移动超时时间 (s) (10.0→5.0 加快恢复行为触发)
    
    # 目标检查：判断是否到达目的地
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25              # 到达目标的距离容差 (m)
      yaw_goal_tolerance: 0.25             # 到达目标的角度容差 (rad)
    
    # ------------------------------------------------------------------
    # MPPI 局部控制器参数
    # 插件：nav2_mppi_controller::MPPIController
    # ------------------------------------------------------------------
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # ── 基础运动学约束（与底盘匹配）──
      motion_model: "DiffDrive"            # 差速驱动运动学模型
      vx_max:  0.8                         # 最大前进线速度 (m/s)
      vx_min: -0.1                         # 最大后退线速度（允许小幅后退脱困）
      vy_max:  0.0                         # 侧向速度上限（差速车为0）
      wz_max:  1.0                         # 最大角速度 (rad/s)
      ax_max:  2.0                         # 最大线加速度 (m/s²) —— 保留平滑起步
      ax_min: -2.0                         # 最大线减速度 (m/s²)
      az_max:  3.5                         # 最大角加速度 (rad/s²)

      # ── Monte Carlo 采样参数 ──
      batch_size: 600                     # 每次迭代采样数（600在差速通道导航完全足够，并大幅为CPU减负）
      time_steps: 20                       # 前瞻步数 25 × 0.2s = 5.0s 前瞻（在0.4m/s下覆盖2.0~2.5m预判，彻底覆盖雷达中距离障碍物）
      model_dt: 0.2                        # 与 5Hz 控制周期严格对齐 (1/5Hz=0.2s)，开启控制序列平移(shift)并杜绝异常崩溃

      iteration_count: 1                   # MPPI 迭代次数（增加可提升质量但CPU开销翻倍）
      temperature: 0.3                     # 轨迹权重温度（越小越集中在最优轨迹附近）
      gamma: 0.015                         # 时间折扣因子

      # ── 控制噪声标准差（控制探索多样性）──
      vx_std: 0.3
      wz_std: 0.25                         # 0.4 -> 0.25 降低角速度高频扰动探索，提升转弯连续平滑度
      vy_std: 0.0                          # 差速车固定为 0

      # ── Critics（代价评估器）──
      critics: [
        "ConstraintCritic",
        "CostCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "PreferForwardCritic"
      ]

      # ── Critic 权重 ──
      ConstraintCritic.enabled: true
      ConstraintCritic.cost_power: 1
      ConstraintCritic.cost_weight: 4.0

      CostCritic.enabled: true
      CostCritic.cost_power: 1
      CostCritic.cost_weight: 14.0 # (强化代价排斥力，让小车主动避让障碍物)
      CostCritic.critical_cost: 253.0
      CostCritic.consider_footprint: True  # 按机器人轮廓计算碰撞（更精确）
      CostCritic.collision_cost: 10000.0
      CostCritic.near_goal_distance: 1.8

      GoalCritic.enabled: true
      GoalCritic.cost_power: 1
      GoalCritic.cost_weight: 5.0
      GoalCritic.threshold_to_consider: 1.4

      GoalAngleCritic.enabled: true
      GoalAngleCritic.cost_power: 1
      GoalAngleCritic.cost_weight: 3.0
      GoalAngleCritic.threshold_to_consider: 0.5

      PathAlignCritic.enabled: true
      PathAlignCritic.cost_power: 1
      PathAlignCritic.cost_weight: 1.8  # (5.0 -> 3.0 降低刚性航向锁定，赋予避障侧向打舵自由度)
      PathAlignCritic.max_path_occupancy_ratio: 0.05
      PathAlignCritic.trajectory_point_step: 3
      PathAlignCritic.threshold_to_consider: 0.5
      PathAlignCritic.offset_from_furthest: 20
      PathAlignCritic.use_path_orientations: false # 暂时设为false，待平滑路径在RViz中验证无尖角后再评估开启

      PathFollowCritic.enabled: true
      PathFollowCritic.cost_power: 1
      PathFollowCritic.cost_weight: 2.0 # (5.0 -> 3.0 适度降低对参考线的硬贴合约束，允许局部借道避障)
      PathFollowCritic.offset_from_furthest: 25
      PathFollowCritic.threshold_to_consider: 1.4

      PathAngleCritic.enabled: true
      PathAngleCritic.cost_power: 1
      PathAngleCritic.cost_weight: 1.5  # 3.0→1.5 适度柔化转角权重，杜绝微小角度误差导致打满±1.0rad/s打舵震荡
      PathAngleCritic.offset_from_furthest: 4
      PathAngleCritic.threshold_to_consider: 0.5
      PathAngleCritic.max_angle_to_furthest: 1.2
      PathAngleCritic.forward_preference: true

      PreferForwardCritic.enabled: true
      PreferForwardCritic.cost_power: 1
      PreferForwardCritic.cost_weight: 5.0
      PreferForwardCritic.threshold_to_consider: 0.5

      # ── 可视化 ──
      visualize: true                      # 调试时可改为 true，在RViz查看所有采样轨迹
      publish_optimal_trajectory: true     # 发布最优轨迹供RViz显示
      transform_tolerance: 0.5

# ------------------------------------------------------------------------------
# 局部代价地图 (Local Costmap) - 负责实时感知避障
# 改造：弃用 VoxelLayer，改用 ObstacleLayer 消费 /scan（2D激光），彻底消除Z轴漂移问题
# ------------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0               # 地图更新频率 (Hz)
      publish_frequency: 2.0               # 可视化发布频率 (Hz)
      global_frame: odom                   # [LIO-SAM] 局部地图以 odom 为参考系
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true                 # 局部地图随车移动
      width: 7                             # 局部地图宽度 (m)
      height: 7                            # 局部地图高度 (m)
      resolution: 0.05                     # 分辨率(m/pixel)
      # 真实车体轮廓：以两后轮轴中心(base_link)为原点，前端距离中心 0.58m，后端距离中心 0.07m，车宽 0.55m (左右各 0.275m)
      footprint: "[ [0.58, 0.275], [-0.07, 0.275], [-0.07, -0.275], [0.58, -0.275] ]"
      transform_tolerance: 3.0                  
      plugins: ["obstacle_layer", "inflation_layer"]  # 弃用 voxel_layer
      filters: ["keepout_filter"]

      # 掩膜层过滤器：加载禁区掩膜 (KeepoutFilter)
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"

      # 2D障碍物层：消费 /scan（由 pointcloud_to_laserscan 转换），2D射线追踪稳定可靠
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        # max_obstacle_height: 3.0
        # min_obstacle_height: -10.0
        max_obstacle_height: 100.0 # 3-->100(2026.09.14)
        min_obstacle_height: -100.0 # -10 -> -100 (2026.09.14)
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 100.0 # 3-->100(2026.09.14)
          min_obstacle_height: -100.0 # -10 -> -100 (2026.09.14)
          # max_obstacle_height: 3.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: true # 设为true匹配pointcloud_to_laserscan的use_inf，确保无遮挡射线能实时清除残留障碍
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0 #0.15 ->0.0 (2026.09.14)
          observation_persistence: 0.5     # 持久化，依赖实时激光清除


      # 膨胀层：防止机器人贴墙走
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.6

      always_send_full_costmap: True

# ------------------------------------------------------------------------------
# 全局代价地图 (Global Costmap) - 负责长距离规划导航
# 改造：弃用 VoxelLayer，改用 ObstacleLayer 消费 /scan（2D激光），彻底消除Z轴漂移问题
# ------------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0                # 周期性更新频率 (全局地图1.0Hz)
      publish_frequency: 1.0               # 可视化发布频率
      global_frame: map                    # 全局地图以map为参考系
      robot_base_frame: base_link
      use_sim_time: False
      # 真实车体轮廓：以两后轮轴中心(base_link)为原点，前端距离中心 0.58m，后端距离中心 0.07m，车宽 0.55m (左右各 0.275m)
      footprint: "[ [0.58, 0.275], [-0.07, 0.275], [-0.07, -0.275], [0.58, -0.275] ]"
      transform_tolerance: 3.0                  
      resolution: 0.05
      track_unknown_space: false            # 是否跟踪未知区域
      always_send_full_costmap: True      # 从 True 改为 False（禁止全量发布节省带宽）(RVIZ2 show )
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]  # 弃用 voxel_layer
      filters: ["keepout_filter"]

      # 掩膜层过滤器：加载禁区掩膜 (KeepoutFilter)
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"

      # 2D障碍物层：消费 /scan，observation_persistence=0 依赖实时扫描清除，彻底杜绝幽灵障碍积累
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        
        min_obstacle_height: -10.0
        max_obstacle_height: 35.0

        observation_sources: scan
        scan:
          topic: /scan
          min_obstacle_height: -10.0
          max_obstacle_height: 35.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: true
          raytrace_max_range: 9.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.5
          obstacle_min_range: 0.0
          observation_persistence: 1.0     # 维持1.0秒短暂记忆窗口，确保全局规划器在遇障时有足够的稳定障碍图层进行借道绕行

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.6
# ------------------------------------------------------------------------------
# 规划器服务器 (Planner Server) - 负责全局路径计算
# ------------------------------------------------------------------------------
planner_server:
  ros__parameters:
    expected_planner_frequency: 0.5
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.8                       # 终点容差 (0.5m -> 0.8m，增加航点绕障容错弹性)
      allow_unknown: true                  # 允许在未知区域规划
      # use_final_approach_orientation: false
      use_cost_power: 3
      cost_travel_multiplier: 2.0   # 新增：穿越高代价区域的惩罚因子，迫使规划器绕行

      # ── SmacPlanner2D 原生内置平滑器（方案 A）──
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

# ------------------------------------------------------------------------------
# 路径平滑器服务器 (Smoother Server) - 消除全局路径航点缝合尖角
# ------------------------------------------------------------------------------
smoother_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: "global_costmap/costmap_raw"
    footprint_topic: "global_costmap/published_footprint"
    robot_base_frame: "base_link"
    transform_tolerance: 0.5
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      w_data: 0.2
      w_smooth: 0.3
      do_refinement: True
      refinement_num: 2
# ------------------------------------------------------------------------------
# 速度平滑器 (Velocity Smoother) - 限制速度突变以保护电机
# ------------------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0              # 平滑频率
    scale_velocities: False
    feedback: "OPEN_LOOP"                  # [安全修复] 改为开环模式，强行硬截断 cmd_vel 不超过 0.4m/s 和 1.0rad/s，杜绝反馈爆炸
    max_velocity: [0.8, 0.0, 1.2]          # [max_v_x, max_v_y, max_w_z] - 与 MPPI 控制器上限同步
    min_velocity: [-0.8, 0.0, -1.2]        # 反向速度与正向对称
    max_accel: [2.5, 0.0, 3.5]             # 加速度限制
    max_decel: [-2.5, 0.0, -3.5]           # 减速度限制
    deadband_velocity: [0.0, 0.0, 0.0]     # 死区速度
    odom_topic: "local_lidar_odom"         # [LIO-SAM] Subscribe to 100Hz local_lidar_odom published by LIO-SAM
    odom_duration: 0.1

# ------------------------------------------------------------------------------
# 行为服务器 (Behavior Server) - 负责卡住时的自动脱困及恢复行为
# ------------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin","backup", "drive_on_heading", "wait"]
    # behavior_plugins: ["drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0               # 恢复动作前向模拟时间
    max_rotational_vel: 0.8                # 恢复旋转最大角速度
    min_rotational_vel: 0.2                # 恢复旋转最小角速度
    rotational_acc_lim: 1.6                # 恢复旋转加速度限制

# ==============================================================================
# Costmap Filters 掩膜层服务节点参数配置 (Keepout 禁区过滤)
# 对应 nav2_map_server 中的 costmap_filter_info_server 与 filter_mask_server
# ==============================================================================
costmap_filter_info_server:
  ros__parameters:
    use_sim_time: False
    type: 0 # 0: Keepout Zone (禁区), 1: Speed Zone (限速百分比), 2: Speed Zone (绝对限速 m/s)
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/filter_mask"
    base: 0.0
    multiplier: 1.0

filter_mask_server:
  ros__parameters:
    use_sim_time: False
    frame_id: "map"
    topic_name: "/filter_mask"
    yaml_filename: "maps/keepout_mask.yaml" # 掩膜地图 yaml 路径，也可在 launch 中通过参数传入重写

# 兼容官方 nav2_bringup 命名规范的别名（如果通过 keepout_zone_launch.py 启动）
keepout_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: False
    type: 0
    filter_info_topic: "keepout_costmap_filter_info"
    mask_topic: "keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

keepout_filter_mask_server:
  ros__parameters:
    use_sim_time: False
    frame_id: "map"
    topic_name: "keepout_filter_mask"
    yaml_filename: "maps/keepout_mask.yaml"
