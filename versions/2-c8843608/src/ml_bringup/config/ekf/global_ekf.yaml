# 输出 /global_odometry/filter，话题名称由正式 launch 重映射设置。
# 当前双 EKF：Global 唯一发布 map -> odom。
# Local EKF 的 x、y、yaw 位姿差分 + NDT 绝对位姿。
# 定位不融合轮速；默认 launch 给两层 EKF 叠加 Yesense 角速度。
# Local 差分运动与直接 IMU 输入存在相关性，不能视作独立信息；通过 TF 使用 odom -> base_link。
# 延迟 NDT 测量保留 2 秒历史；predict_to_current_time=true 将输出预测至当前时刻。
# 状态向量顺序：x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az。
/global/ekf_filter_node_global:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.6
    smooth_lagged_data: true
    history_length: 2.0
    two_d_mode: true
    print_diagnostics: true
    debug: false
    publish_tf: true
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map
    pose0: /ml_localization/ndt_pose
    pose0_config: [
      true, true, true,
      true, true, true,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    pose0_differential: false
    pose0_relative: false
    pose0_queue_size: 10
    odom0: /local_odometry/filter
    # 位姿差分转换为运动观测，不将 odom 系位置当成 map 系绝对位置。
    odom0_config: [
      true, true, false,
      false, false, true,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom0_differential: true
    odom0_relative: false
    odom0_queue_size: 20
    use_control: false
    # 完整 15×15 矩阵按行展开，共 225 项，兼容 Humble/Jazzy；非对角项为零。
    process_noise_covariance: [
